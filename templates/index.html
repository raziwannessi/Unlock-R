<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كود Unlockr الخاص بنا</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 400px; width: 90%; }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; margin-bottom: 30px; }
        button { background: #10b981; color: white; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.3s; width: 100%; }
        button:hover { background: #059669; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .code-box { margin-top: 30px; font-size: 48px; font-weight: bold; letter-spacing: 5px; color: #fbbf24; text-shadow: 0 0 20px rgba(251, 191, 36, 0.5); display: none; }
        .error { color: #ef4444; margin-top: 20px; display: none; }
        .spinner { display: none; margin: 20px auto; border: 4px solid #334155; border-top: 4px solid #10b981; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>مولد أكواد Unlockr</h1>
        <p>دوس على الزرار عشان تجيب كود جديد</p>
        
        <button id="btn" onclick="getCode()">جيب كود جديد</button>
        
        <div class="spinner" id="spinner"></div>
        <div class="code-box" id="codeDisplay"></div>
        <div class="error" id="errorDisplay"></div>
    </div>

    <script>
        async function getCode() {
            const btn = document.getElementById('btn');
            const spinner = document.getElementById('spinner');
            const codeDisplay = document.getElementById('codeDisplay');
            const errorDisplay = document.getElementById('errorDisplay');

            // تصفير الواجهة
            btn.disabled = true;
            btn.innerText = "جاري السحب...";
            spinner.style.display = 'block';
            codeDisplay.style.display = 'none';
            errorDisplay.style.display = 'none';

            try {
                const response = await fetch('/get_code');
                const data = await response.json();

                if (data.success) {
                    codeDisplay.innerText = data.code;
                    codeDisplay.style.display = 'block';
                } else {
                    errorDisplay.innerText = "خطأ: " + data.error;
                    errorDisplay.style.display = 'block';
                }
            } catch (err) {
                errorDisplay.innerText = "حدث خطأ في الاتصال بالسيرفر.";
                errorDisplay.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "جيب كود جديد";
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
